<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – LearnHub</title>
  <meta name="description" content="Sign in to your LearnHub account to continue learning." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon"><i class="fa-solid fa-rocket"></i></div>
        <span>Learn<span class="accent">Hub</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="courses.html" class="nav-link">Courses</a></li>
      </ul>
      <div class="nav-auth">
        <a href="register.html" class="btn btn-primary btn-sm">Create Account</a>
      </div>
      <button class="nav-toggle"><i class="fa-solid fa-bars"></i></button>
    </div>
  </nav>

  <main>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div style="width:64px;height:64px;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;box-shadow:0 4px 15px rgba(37,99,235,0.3);">
            <i class="fa-solid fa-rocket" style="font-size:1.75rem;color:#fff;"></i>
          </div>
          <h2>Welcome Back</h2>
          <p>Sign in to continue your learning journey</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="login-email" class="form-control" placeholder="you@example.com" autocomplete="email" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="login-password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
            </div>
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
          </button>
        </form>

        <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem;color:var(--text-muted);">
          Don't have an account?
          <a href="register.html" style="font-weight:700;">Create one for free</a>
        </p>

        <!-- Demo Quick-Login -->
        <div class="demo-login-box">
          <p>Quick Demo Login</p>
          <div class="demo-buttons-wrap">
            <button onclick="fillDemoCredentials('student')" class="btn btn-sm btn-outline-primary btn-block">
              <i class="fa-solid fa-user-graduate"></i> Student Demo
            </button>
            <button onclick="fillDemoCredentials('admin')" class="btn btn-sm btn-outline btn-block" style="border-color:var(--secondary);color:var(--secondary);">
              <i class="fa-solid fa-shield-halved"></i> Admin Demo
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
