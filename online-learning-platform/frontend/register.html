<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – LearnHub</title>
  <meta name="description" content="Register for free on LearnHub and start your learning journey today." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon"><i class="fa-solid fa-rocket"></i></div>
        <span>Learn<span class="accent">Hub</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="courses.html" class="nav-link">Courses</a></li>
      </ul>
      <div class="nav-auth">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
      <button class="nav-toggle"><i class="fa-solid fa-bars"></i></button>
    </div>
  </nav>

  <main>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div style="width:64px;height:64px;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--secondary),var(--primary));display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;box-shadow:0 4px 15px rgba(124,58,237,0.3);">
            <i class="fa-solid fa-user-plus" style="font-size:1.75rem;color:#fff;"></i>
          </div>
          <h2>Create Your Account</h2>
          <p>Join 50,000+ learners — it's completely free to start</p>
        </div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="reg-name" class="form-control" placeholder="e.g. Jane Smith" autocomplete="name" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" autocomplete="email" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" autocomplete="new-password" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-check-circle"></i>
              <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-role">Account Type</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-id-badge"></i>
              <select id="reg-role" class="form-control select-control" style="padding-left:2.6rem;">
                <option value="student">Student – I want to learn</option>
                <option value="admin">Admin – I want to manage courses</option>
              </select>
            </div>
          </div>

          <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">
            <i class="fa-solid fa-user-plus"></i> Create Free Account
          </button>
        </form>

        <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem;color:var(--text-muted);">
          Already have an account?
          <a href="login.html" style="font-weight:700;">Sign in here</a>
        </p>

        <p style="text-align:center;margin-top:1rem;font-size:0.8rem;color:var(--text-light);">
          By creating an account you agree to our
          <a href="#" style="color:var(--text-muted);">Terms of Service</a> and
          <a href="#" style="color:var(--text-muted);">Privacy Policy</a>.
        </p>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
